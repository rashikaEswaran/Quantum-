<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PM / OSM92 Dashboard 3D</title>
<style>
:root{--bg:#10151b;--panel:#2b3a36;--panel-b:#52625d;--txt:#e6efe9;--blue:#5fb8ff;--pink:#ff6b8b;--green:#2bff8a;--pill:#232a31}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0a0e12;color:var(--txt);font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden}
#wrap{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1088px;height:656px;background:var(--bg);flex:none;transform-origin:center;border-top:2px solid #1d6fd1}
svg{position:absolute;inset:0;width:100%;height:100%}
.pill{position:absolute;top:40px;height:19px;width:79px;border-radius:10px;background:var(--pill);border:1px solid #3c4650;color:var(--txt);font-size:11px;text-align:center;line-height:17px;cursor:pointer;user-select:none;outline:0;padding:0}
select.pill{appearance:none;-webkit-appearance:none;text-align-last:center}
input.pill{cursor:text}
.pill:focus-visible,.box input:focus-visible,.box select:focus-visible,#pm:focus-visible{outline:2px solid var(--blue)}
#mode{background:#4a5560;font-weight:600}
.box{position:absolute;background:var(--panel);border:1px solid var(--panel-b);border-radius:8px}
#pm{left:36px;top:56px;width:96px;height:58px;font-size:20px;padding:6px 12px;cursor:pointer;color:#fff}
#pm small{display:block;font-size:10px;color:#9fe8be;margin-top:4px}
#osm{left:30px;top:445px;width:157px;height:162px;border-radius:10px}
#osm h3{margin:8px 14px;font:400 18px "Segoe UI",sans-serif}
#osm .f{position:absolute;left:73px;width:73px;height:16px;border-radius:8px;background:#222a2f;border:1px solid #475058;color:#fff;font-size:9px;text-align:center;padding:0;outline:0}
#chip{position:absolute;left:990px;top:295px;width:55px;height:130px;border-radius:5px;background:#e9eef0;border:1px solid #9aa;color:#222;font-size:7px;text-align:center;padding-top:30px}
#chip b{font-weight:500;font-size:9px;display:block;margin-top:4px}
#tip{position:absolute;left:0;top:0;pointer-events:none;background:#000c;border:1px solid #3a6a8a;border-radius:6px;padding:4px 8px;font-size:11px;opacity:0;transition:opacity .15s;white-space:nowrap;z-index:5}
.node{cursor:pointer}.node path{fill:#3d474c;stroke:#6b7a80;stroke-width:1;transition:fill .2s}
.node:hover path{fill:#4f5d63}.node.off path{fill:#241f22;stroke:#7a3a45}
.node text{fill:#e4ecef;font-size:11px;pointer-events:none}
.lbl{fill:#d6dde0;font-size:10px}
.flow{fill:none;stroke-linecap:round;stroke-linejoin:round}
.glow{stroke:#4a8fd0;stroke-width:9;opacity:.22}.core{stroke:#a9d6ff;stroke-width:2;opacity:.55}
.dots{stroke:var(--blue);stroke-width:3;stroke-dasharray:.1 9;animation:mv var(--dur,1.2s) linear infinite}
.dots.b{stroke:var(--pink);stroke-width:2.5;stroke-dasharray:.1 13;animation-duration:calc(var(--dur,1.2s)*1.4)}
.off-p{opacity:.12}
@keyframes mv{to{stroke-dashoffset:-100}}
.vl{stroke-dasharray:3 5;animation:dn var(--dur2,1s) linear infinite}
@keyframes dn{to{stroke-dashoffset:-32}}
.wave{fill:none;stroke:#c36bff;stroke-width:1.6;filter:drop-shadow(0 0 3px #c36bff);stroke-dasharray:6 3;animation:dn var(--dur2,1s) linear infinite}
.pulse{animation:pl 1.6s ease-in-out infinite}
@keyframes pl{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.dots,.vl,.wave,.pulse{animation:none}}
</style>
</head>

 <select class="f" id="o1" style="top:58px"></select>
 <input class="f" id="o2" style="top:90px" value="0.4" aria-label="Gain">
 <input class="f" id="o3" style="top:121px" value="0.1" aria-label="Offset">
</div>

</div></div>

<script>
(function(){
const NS="http://www.w3.org/2000/svg",$=id=>document.getElementById(id);
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};
const stage=$('stage');
function fit(){const s=Math.min(innerWidth/1088,innerHeight/658);stage.style.transform='scale('+s+')'}
addEventListener('resize',fit);fit();

/* ---------- Circuit ---------- */
const P=[
 'M400,100 V96 Q404,88 416,88 H1006 Q1018,88 1018,100 V600 Q1018,612 1006,612 H958',
 'M445,122 H580',
 'M602,152 V300 Q602,332 640,332 H690',
 'M975,215 V320 H750 V150 Q750,140 760,140 H960',
 'M948,200 H650 Q635,200 635,215 V555 Q635,590 670,590 H740 Q755,590 755,605 V615 H625',
 'M795,268 H690 Q680,268 680,278 V430',
 'M818,295 V450 H835',
 'M590,380 H970 V540',
 'M706,455 H835',
 'M858,485 V555 Q858,565 868,565 H942',
 'M596,500 V582'
];
const tr=$('traces'),paths=[];
P.forEach((d,i)=>{
 const g=el('g',{class:'trace'},tr);
 el('path',{d,class:'flow glow'},g);el('path',{d,class:'flow core'},g);
 el('path',{d,class:'flow dots'},g);
 const b=el('path',{d,class:'flow dots b'},g);b.style.animationDelay=(-i*.17)+'s';
 paths.push(g);
});
/* nodes: [label,x,y,connected path indexes] */
const N=[['R2',580,102,[1,2]],['R6',948,165,[3]],['R5',792,245,[5,6]],['R3',660,427,[5,8]],['R2',835,432,[6,8,9]],['R8',942,528,[9,7]],['R4',572,582,[10,4]]];
const ng=$('nodes'),state={};
N.forEach((n,i)=>{
 const g=el('g',{class:'node',transform:`translate(${n[1]},${n[2]})`,tabindex:0,role:'button','aria-label':'Resistor '+n[0]},ng);
 el('path',{d:'M0,8 Q0,0 8,0 H48 V26 Q48,50 24,50 H8 Q0,50 0,42 Z'},g);
 el('path',{d:'M8,24 L16,20 L16,28 Z',style:'fill:#8c9aa0;stroke:none'},g);
 el('path',{d:'M20,38 L26,32 L32,38 Z',style:'fill:#8c9aa0;stroke:none'},g);
 const t=el('text',{x:24,y:20,'text-anchor':'middle'},g);t.textContent=n[0];
 state[i]=true;
 const tog=()=>{state[i]=!state[i];g.classList.toggle('off',!state[i]);n[3].forEach(p=>{
   const on=N.some((m,j)=>state[j]&&m[3].includes(p));paths[p].classList.toggle('off-p',!on);});
   status('Node '+n[0]+(state[i]?' enabled':' bypassed'),n[1],n[2]);};
 g.addEventListener('click',tog);
 g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tog()}});
});
['ls','dr'].forEach(id=>{$(id).addEventListener('click',()=>status(id.toUpperCase()+' signal OK',+$(id).getAttribute('transform').match(/\d+/g)[0],+$(id).getAttribute('transform').match(/\d+/g)[1]))});

/* ---------- Controls ---------- */
const tip=$('tip');let tt;
function status(msg,x,y){tip.textContent=msg;tip.style.left=Math.min(x,960)+'px';tip.style.top=(y-26)+'px';tip.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>tip.style.opacity=0,1500)}
const chan=$('chan');for(let i=1;i<=64;i++)chan.add(new Option(i,i));chan.value=34;
const preset=$('preset');['Preset','Calibrate','Warm-up','Max flow','Silent'].forEach(p=>preset.add(new Option(p,p)));
const o1=$('o1');['0.5600','0.2500','0.7500','1.0000'].forEach(v=>o1.add(new Option(v,v)));
const modes={Normal:1,Eco:.5,Turbo:2};let mode='Normal';
const presets={Preset:null,Calibrate:[100,'Normal','0.2500','0.4','0.1'],'Warm-up':[80,'Eco','0.5600','0.2','0.1'],'Max flow':[200,'Turbo','1.0000','0.8','0.3'],Silent:[40,'Eco','0.2500','0.1','0.0']};
let on=true;
function apply(){
 const f=Math.max(10,Math.min(400,+$('freq').value||120));
 const k=on?f/120*modes[mode]*(0.6+parseFloat(o1.value)*.6):0;
 window.__k=k;const s=stage.style;
 s.setProperty('--dur',(k?1.2/k:0)+'s');s.setProperty('--dur2',(k?1/k:0)+'s');
 stage.querySelectorAll('.dots,.vl,.wave').forEach(e=>e.style.animationPlayState=k?'running':'paused');
 stage.querySelectorAll('.glow').forEach(e=>e.style.opacity=on?(.1+Math.min(.3,+$('o2').value*.3)):.05);
}
$('freq').addEventListener('input',apply);
$('freq').addEventListener('wheel',e=>{e.preventDefault();$('freq').value=Math.max(10,+$('freq').value+(e.deltaY<0?5:-5));apply()},{passive:false});
$('mode').addEventListener('click',()=>{const k=Object.keys(modes);mode=k[(k.indexOf(mode)+1)%k.length];$('mode').textContent=mode;apply()});
[o1,$('o2'),$('o3'),chan].forEach(e=>e.addEventListener('input',apply));
preset.addEventListener('change',()=>{const p=presets[preset.value];if(!p)return;
 $('freq').value=p[0];mode=p[1];$('mode').textContent=mode;o1.value=p[2];$('o2').value=p[3];$('o3').value=p[4];apply();
 status('Preset loaded: '+preset.value,830,60);
 broadcastChange();
});
$('pm').addEventListener('click',()=>{on=!on;$('pms').textContent=on?'ONLINE':'OFFLINE';$('pms').style.color=on?'#9fe8be':'#ff8a8a';apply();broadcastChange();});

function broadcastChange(){
  if(window.parent && window.parent !== window){
    window.parent.postMessage({
      type:'DASHBOARD_UPDATED',
      payload:{
        freq: +$('freq').value,
        mode: mode,
        chan: +chan.value,
        preset: preset.value,
        o1: o1.value,
        o2: $('o2').value,
        o3: $('o3').value,
        power: on
      }
    }, '*');
  }
}
$('freq').addEventListener('change', broadcastChange);
$('mode').addEventListener('click', broadcastChange);
chan.addEventListener('change', broadcastChange);
o1.addEventListener('change', broadcastChange);
$('o2').addEventListener('change', broadcastChange);
$('o3').addEventListener('change', broadcastChange);

/* Listen to live updates from QuantumTrace AI application */
window.addEventListener('message', (e) => {
  if (!e.data || e.data.type !== 'UPDATE_TELEMETRY') return;
  const d = e.data.payload || {};
  if (d.freq != null) $('freq').value = d.freq;
  if (d.mode != null && modes[d.mode]) { mode = d.mode; $('mode').textContent = mode; }
  if (d.chan != null) chan.value = d.chan;
  if (d.o1 != null) o1.value = d.o1;
  if (d.o2 != null) $('o2').value = d.o2;
  if (d.o3 != null) $('o3').value = d.o3;
  if (d.power != null) {
    on = !!d.power;
    $('pms').textContent = on ? 'ONLINE' : 'OFFLINE';
    $('pms').style.color = on ? '#9fe8be' : '#ff8a8a';
  }
  apply();
  if (d.toast) {
    status(d.toast, 540, 50);
  }
});

/* live reading */
let v=145;
setInterval(()=>{if(!on){$('live').textContent='0';return}
 const base=+$('freq').value*1.2*modes[mode]+(+$('o2').value*10);
 v+=(base-v)*.2+(Math.random()-.5)*4;$('live').textContent=Math.round(v)},400);
apply();
})();
</script>

<script>
if (typeof THREE === 'undefined') {
  document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');
}

<script>
(function(){
if (typeof THREE === 'undefined') {
  console.warn('Three.js offline/unavailable - using high-resolution cryostat digital twin layer');
  return;
}
const cv=document.getElementById('rc');
const cryoImg = document.getElementById('cryo-img');
if (!cv) return;
let R;
try {
  R=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true});
  R.setSize(880,1180,false);
} catch (err) {
  console.warn('WebGL init note:', err);
  return;
}
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(38,440/590,.1,100);
const home={y:.6,x:.25,z:23};let rotY=home.y,rotX=home.x,dist=home.z,drag=false,lx=0,ly=0,auto=true;
sc.add(new THREE.AmbientLight(0x88aacc,.7));
const L1=new THREE.PointLight(0x33ff99,1.6,40);L1.position.set(0,8,6);sc.add(L1);
const L2=new THREE.PointLight(0x33ccff,1.8,40);L2.position.set(0,-6,6);sc.add(L2);
const L3=new THREE.PointLight(0xff6060,1,30);L3.position.set(-7,3,4);sc.add(L3);
const G=new THREE.Group();sc.add(G);
const M=(c,e,ei,o)=>new THREE.MeshStandardMaterial({color:c,emissive:e,emissiveIntensity:ei,metalness:.3,roughness:.35,transparent:o<1,opacity:o,depthWrite:o>=.95});
const box=(w,h,d,y,m,edge)=>{const g=new THREE.BoxGeometry(w,h,d),me=new THREE.Mesh(g,m);me.position.y=y;G.add(me);
 if(edge){const l=new THREE.LineSegments(new THREE.EdgesGeometry(g),new THREE.LineBasicMaterial({color:edge,transparent:true,opacity:.7}));l.position.y=y;G.add(l)}return me};
function glowTex(c){const k=document.createElement('canvas');k.width=k.height=128;const x=k.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64);
 g.addColorStop(0,'#fff');g.addColorStop(.25,c);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(k)}
const spr=(c,s,y,o)=>{const p=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex(c),blending:THREE.AdditiveBlending,transparent:true,opacity:o,depthWrite:false}));p.scale.set(s,s,1);p.position.y=y;G.add(p);return p};

/* slabs (inverted pyramid) */
const slabM=M(0x4aa8ff,0x1b6fd8,.9,1);
[[5.6,10.2,8.2],[1.75,8,6.4],[.3,6.8,5.4],[-3,5.4,4.4]].forEach(a=>box(a[1],.3,a[2],a[0],slabM,0xbfe6ff));
/* chambers */
box(8.1,3.45,6.5,3.5,M(0xc0393f,0x7a1c24,.6,.38),0xff7b7b);
box(6.7,1,5.3,.9,M(0x39434d,0x101820,.2,.9),0x7a8a99);
box(5.2,2.9,4.2,-1.55,M(0x28b6d8,0x0a6e96,.7,.35),0x6fe6ff);
/* top green cubes */
const gm=M(0x1fdc72,0x0fb85a,1,1),gcubes=[];
[[-1.9,1.05,1.7],[0,1.5,2.4],[1.9,1.05,1.7]].forEach(a=>{const m=box(a[1]*1.6,a[1]*1.1,a[2]*1.1,6.8+(a[1]-1.05)*.3,gm,0x8affc0);m.position.x=a[0];gcubes.push(m)});
G.children[G.children.length-1];
/* inner green blocks */
const inA=box(1.4,1.1,1.4,4.2,gm,0x8affc0);inA.position.set(-1.2,4.4,0);
const inB=box(1.4,1.1,1.4,-1.6,gm,0x8affc0);inB.position.set(1.0,-1.6,0);
/* bottom cube */
box(2.3,2,2.3,-4.7,M(0x0b5a82,0x0aa0d8,.6,.45),0x9cf0ff);
const core=spr('#7ff0ff',4.2,-4.7,1);const topGlow=spr('#35ff95',6,6.8,.45);const redGlow=spr('#ff5a5a',5,3.5,.12);

/* light-beam bundles: cyan lines with travelling beads */
const cyanLine=new THREE.LineBasicMaterial({color:0x9fe9ff,transparent:true,opacity:.38,blending:THREE.AdditiveBlending,depthWrite:false});
const gauss=()=>(Math.random()+Math.random()+Math.random()-1.5)/1.5,beads=[];
function bundle(y0,y1,n,sx,sz,col,size){
 const lp=[],pos=[];for(let i=0;i<n;i++){const x=gauss()*sx,z=gauss()*sz;lp.push(x,y0,z,x,y1,z);pos.push([x,z])}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(lp,3));G.add(new THREE.LineSegments(g,cyanLine));
 const m=n*2,ar=new Float32Array(m*3),ph=[],sp=[];for(let i=0;i<m;i++){ph.push(Math.random());sp.push(.4+Math.random()*.6)}
 const bg=new THREE.BufferGeometry();bg.setAttribute('position',new THREE.BufferAttribute(ar,3));
 G.add(new THREE.Points(bg,new THREE.PointsMaterial({color:col,size,transparent:true,opacity:.95,blending:THREE.AdditiveBlending,depthWrite:false})));
 beads.push({y0,y1,pos,ar,ph,sp,bg,m});
}
bundle(5.4,1.9,120,1.7,1.3,0xdffaff,.09);
bundle(1.6,.45,50,1.5,1.2,0xdffaff,.08);
bundle(-.15,-2.9,100,1.5,1.2,0xbff6ff,.09);
bundle(6.55,5.7,70,1.5,1.1,0xffffff,.1);
bundle(-3.2,-4.0,30,.5,.5,0xffffff,.1);

/* green horizontal bars + connector lines */
const barM=new THREE.MeshBasicMaterial({color:0x3dff8a,transparent:true,opacity:.95});
[[5.12,2.5,.4],[3.67,2.1,.6],[3.42,2.9,.4]].forEach(a=>{const m=new THREE.Mesh(new THREE.BoxGeometry(a[1],.07,1.6),barM);m.position.set(a[2],a[0],0);G.add(m)});
const cl=new THREE.BufferGeometry();cl.setAttribute('position',new THREE.Float32BufferAttribute([-.6,4.55,0,2,4.55,0,-.6,4.25,0,1.6,4.25,0],3));
G.add(new THREE.LineSegments(cl,new THREE.LineBasicMaterial({color:0x3dff8a,transparent:true,opacity:.6})));

/* green dot rows (horizontal planes of dots) */
const rows=[];
function dotRow(y,x0,x1,zs){const p=[];for(let x=x0;x<=x1;x+=.3)for(let z=-zs;z<=zs;z+=.45)p.push(x,y,z);
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));
 const m=new THREE.PointsMaterial({color:0x3dff8a,size:.1,transparent:true,opacity:.8,blending:THREE.AdditiveBlending,depthWrite:false});G.add(new THREE.Points(g,m));rows.push(m)}
[3.3,3.05,2.8,2.55,2.3,2.05].forEach(y=>dotRow(y,-2.8,2.8,1.4));
for(let y=-.2;y>-2.7;y-=.28)dotRow(y,-2.2,2.2,1.1);

/* purple double-strand waves */
const hel=[];
[[-3.25,5.4,1.9],[3.25,5.4,1.9],[-3.0,5.4,1.9],[3.0,5.4,1.9],[-2.8,1.4,.3],[2.8,1.4,.3]].forEach((h,i)=>{
 const N=80,ls=[0,1].map(()=>{const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(N*3),3));
  G.add(new THREE.Line(g,new THREE.LineBasicMaterial({color:0xc36bff,transparent:true,opacity:.9,blending:THREE.AdditiveBlending})));return g});
 hel.push({h,ls,N,i})});

/* bottom cube: converging beams + star core */
const sl=[];for(let i=0;i<14;i++){const a=i/14*Math.PI*2;sl.push(Math.cos(a)*1.1,-3.7,Math.sin(a)*1.1,0,-4.7,0,Math.cos(a)*1.1,-5.7,Math.sin(a)*1.1,0,-4.7,0)}
const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.Float32BufferAttribute(sl,3));
G.add(new THREE.LineSegments(sg,new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.55,blending:THREE.AdditiveBlending})));
const star=spr('#ffffff',2.2,-4.7,1);
for(let y=-4.2;y<-3.6;y+=.2)dotRow(y,-.9,.9,.9);

/* interaction */
cv.addEventListener('pointerdown',e=>{drag=true;auto=false;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing'});
cv.addEventListener('pointermove',e=>{if(!drag)return;rotY+=(e.clientX-lx)*.01;rotX=Math.max(-.5,Math.min(1.1,rotX+(e.clientY-ly)*.006));lx=e.clientX;ly=e.clientY});
cv.addEventListener('pointerup',()=>{drag=false;cv.style.cursor='grab'});
cv.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(14,Math.min(34,dist+e.deltaY*.01))},{passive:false});
cv.addEventListener('dblclick',()=>{rotY=home.y;rotX=home.x;dist=home.z;auto=true});

let t=0,last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;
 const k=window.__k==null?1:window.__k;t+=dt*k;
 if(auto&&!drag)rotY+=dt*.25*Math.min(1,k);
 G.rotation.y=rotY;G.rotation.x=rotX;G.position.y=-.8;cam.position.set(0,.8,dist);cam.lookAt(0,0,0);
 beads.forEach(b=>{const n=b.pos.length;for(let i=0;i<b.m;i++){b.ph[i]=(b.ph[i]+dt*b.sp[i]*k*.6)%1;const p=b.pos[i%n];b.ar[i*3]=p[0];b.ar[i*3+1]=b.y0+(b.y1-b.y0)*b.ph[i];b.ar[i*3+2]=p[1]}b.bg.attributes.position.needsUpdate=true});
 hel.forEach(o=>{const h=o.h;o.ls.forEach((g,s)=>{const a=g.attributes.position.array;for(let i=0;i<o.N;i++){const f=i/(o.N-1),ph=f*20-t*3+o.i+s*Math.PI;a[i*3]=h[0]+Math.sin(ph)*.25;a[i*3+1]=h[1]+(h[2]-h[1])*f;a[i*3+2]=Math.cos(ph)*.25}g.attributes.position.needsUpdate=true})});
 rows.forEach((m,i)=>{m.opacity=k?.4+.55*Math.abs(Math.sin(t*3-i*.55)):.5});
 const p=.75+.25*Math.sin(t*3);gm.emissiveIntensity=.7+.5*p*(k?1:0);core.material.opacity=.6+.4*p;star.material.opacity=.7+.3*p;topGlow.material.opacity=.3+.2*p;
 R.render(sc,cam)}
requestAnimationFrame(frame);
})();
</script>
