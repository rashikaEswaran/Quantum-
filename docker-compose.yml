version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: quantumtrace-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: quantumtrace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quantumtrace-backend
    restart: on-failure
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@db:5432/quantumtrace
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=true
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quantumtrace-frontend
    restart: on-failure
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:

